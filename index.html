/* ===== Page ===== */
*{box-sizing:border-box;}
  html,body{margin:0;background:#fff;height:auto;}
  body{font-family:var(--pa-font-sans);color:var(--pa-ink);-webkit-font-smoothing:antialiased;}
  a{color:var(--pa-primary);text-decoration:none;}
  a:hover{color:var(--pa-primary-700);text-decoration:underline;}
  button{font-family:inherit;}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px);}to{opacity:1;transform:translate(-50%,0);}}
/* ===== Change History panel ===== */
*{box-sizing:border-box;}
    
    .pa-btn{text-transform:uppercase;letter-spacing:.05em;font-weight:500;height:34px;}
    .chp-iconbtn{border:none;background:transparent;cursor:pointer;color:var(--pa-ink);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background 150ms;}
    .chp-iconbtn:hover{background:rgba(33,33,33,0.06);}
    .chp-scroll::-webkit-scrollbar{width:10px;}
    .chp-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.18);border-radius:5px;}
    .chp-ses{flex:0 0 auto;border:1px solid var(--pa-divider);border-radius:var(--pa-radius-sm);overflow:hidden;background:#fff;}
    .chp-seshd{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:none;background:transparent;cursor:pointer;text-align:left;transition:background 150ms;}
    .chp-seshd:hover{background:var(--pa-primary-04a);}
    .chp-badge{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:var(--pa-radius-sm);font-family:var(--pa-font-sans);font-weight:600;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;}
    .chp-box{border:1px solid #EEEEEE;border-radius:var(--pa-radius-sm);overflow:hidden;}
    .chp-boxlbl{font-family:var(--pa-font-sans);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--pa-ink-3);padding:6px 12px;border-bottom:1px solid #EEEEEE;}
    .chp-boxv{padding:10px 12px;font-family:var(--pa-font-display);font-size:12.5px;line-height:20px;white-space:pre-line;}
    .chp-count{display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:var(--pa-radius-pill);background:var(--pa-primary-12a);color:var(--pa-primary);font-family:var(--pa-font-sans);font-weight:600;font-size:10px;margin-left:8px;}
    .chp-vf{position:relative;padding-top:18px;}
    .chp-vf > label{position:absolute;left:0;top:18px;font-family:var(--pa-font-sans);font-size:14px;line-height:20px;color:rgba(0,0,0,0.6);pointer-events:none;transform-origin:top left;white-space:nowrap;transform:translateY(-18px) scale(0.857);transition:color 200ms cubic-bezier(.4,0,.2,1);}
    .chp-vf:focus-within > label{color:#000;}
    .chp-vf__ctrl{width:100%;height:26px;border:none;border-bottom:1px solid #9E9E9E;border-radius:0;background:transparent;padding:0 20px 3px 0;font-family:var(--pa-font-sans);font-size:14px;line-height:20px;color:var(--pa-ink);outline:none;transition:border-color 200ms cubic-bezier(.4,0,.2,1);}
    .chp-vf__ctrl:focus{border-bottom:2px solid var(--pa-primary);padding-bottom:2px;}
    select.chp-vf__ctrl{appearance:none;-webkit-appearance:none;cursor:pointer;}
    .chp-opt:hover{background:var(--pa-primary-04a);}
    .chp-vf__icon{position:absolute;right:0;bottom:4px;font-size:20px;color:var(--pa-ink-3);pointer-events:none;}
    .chp-vf__ctrl::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55;margin:0;padding:0;}
    .chp-vf__ctrl::-webkit-inner-spin-button,.chp-vf__ctrl::-webkit-clear-button{display:none;}
    .chp-chip{height:26px;padding:0 11px;border-radius:var(--pa-radius-pill);border:1px solid;cursor:pointer;font-family:var(--pa-font-sans);font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;transition:background 150ms;}
    .chp-clear{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:none;background:transparent;cursor:pointer;color:var(--pa-primary);font-family:var(--pa-font-sans);font-size:11.5px;font-weight:500;border-radius:var(--pa-radius-sm);}
    .chp-clear:hover{background:var(--pa-primary-04a);}
    .chp-hl{background:rgba(233,143,40,0.28);border-radius:2px;}
    .chp-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:var(--pa-font-display);font-weight:600;font-size:11px;background:var(--pa-primary-050);color:var(--pa-primary);}
    .pa-btn{border-radius:4px !important;} /* __om-btn-square */

  iso(d) { const t = new Date(d + " 00:00:00"); return isNaN(t) ? "" : t.toISOString().slice(0, 10); }

  matchesQuery(c, q) {
    return [c.field, c.value, c.old, c.new].filter(Boolean).join(" ").toLowerCase().includes(q);
  }

  get SESSIONS() { return this.props.sessions || this.DEFAULT_SESSIONS; }
  DEFAULT_SESSIONS = [

    { id: "s2", user: "Danny Velasquez", initials: "DV", date: "Jul 17, 2026", time: "10:02 AM",

      ] },

      ] }
  ];

  diffTokens(oldS, newS) {
    const tok = s => String(s).split(/(\s+)/).filter(x => x.length);
    const a = tok(oldS), b = tok(newS), n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push({ t: "same", s: a[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: "del", s: a[i] }); i++; }
      else { ops.push({ t: "ins", s: b[j] }); j++; }
    }
    while (i < n) ops.push({ t: "del", s: a[i++] });
    while (j < m) ops.push({ t: "ins", s: b[j++] });
    return ops.map(o => ({
      text: o.s,
      bg: o.t === "del" ? "var(--pa-error-bg)" : o.t === "ins" ? "var(--pa-success-bg)" : "transparent",
      color: o.t === "del" ? "var(--pa-error)" : "var(--pa-ink)",
      strike: o.t === "del" ? "line-through" : "none"
    }));
  }

  changeVals(c) {
    const badge = {
      added: { label: "Added", bg: "var(--pa-success-bg)", color: "var(--pa-success)" },
      removed: { label: "Removed", bg: "var(--pa-error-bg)", color: "var(--pa-error)" },
      updated: { label: "Updated", bg: "var(--pa-primary-12a)", color: "var(--pa-primary)" },
      text: { label: "Edited", bg: "var(--pa-primary-12a)", color: "var(--pa-primary)" }
    }[c.type];
    const single = c.type === "added" || c.type === "removed";
    return {
      hasTime: !!c.time, time: c.time || "",
      field: c.field, badgeLabel: badge.label, badgeBg: badge.bg, badgeColor: badge.color,
      isSingle: single, isPair: c.type === "updated", isDiff: c.type === "text",
      singleLabel: c.type === "added" ? "New" : "Old",
      singleValue: c.value || "",
      singleBg: c.type === "added" ? "var(--pa-success-bg)" : "var(--pa-error-bg)",
      singleColor: c.type === "added" ? "var(--pa-ink)" : "var(--pa-ink-3)",
      singleStrike: c.type === "removed" ? "line-through" : "none",
      old: c.old || "", new: c.new || "",
      tokens: c.type === "text" ? this.diffTokens(c.old, c.new) : []
    };
  }

  renderVals() {
    const st = this.state;
    const q = st.q.trim().toLowerCase();
    const type = st.type;
    const anyFilter = !!(q || st.user || st.from || st.to || type !== "all");
    const set = p => this.setState(p);

    const filtered = this.SESSIONS.map(s => {
      const d = this.iso(s.date);
      if (st.user && s.user !== st.user) return null;
      if (st.from && d && d < st.from) return null;
      if (st.to && d && d > st.to) return null;
      const sessionHit = !!q && (s.user.toLowerCase().includes(q) || (s.note || "").toLowerCase().includes(q) || (s.area || "").toLowerCase().includes(q));
      let changes = s.changes;
      if (type !== "all") {
        if (["added", "removed", "updated", "text"].includes(type)) changes = changes.filter(c => c.type === type);
        else if (s.area !== type) return null;
      }
      if (q && !sessionHit) changes = changes.filter(c => this.matchesQuery(c, q));
      if (!changes.length) return null;
      return { ...s, changes };
    }).filter(Boolean);

    const areas = ["Details", "Planning", "Faculty", "Files"].filter(a => this.SESSIONS.some(x => x.area === a));
    const typeDefs = areas.length
      ? [["all", "All"]].concat(areas.map(a => [a, a]))
      : [["all", "All"], ["added", "Added"], ["removed", "Removed"], ["updated", "Updated"], ["text", "Edited"]];

    const sessions = filtered.map(s => {
      const n = s.changes.length;
      const times = s.changes.map(c => c.time).filter(Boolean);
      const auto = times.length > 0;
      const stamp = times.length > 1 && times[0] !== times[times.length - 1]
        ? s.date + " · " + times[0] + " – " + times[times.length - 1] + " ET"
        : s.date + " at " + (times[0] || s.time) + " ET";
      return {
        auto, stamp,
        user: s.user, initials: s.initials, note: s.note || "", hasNote: !!s.note, area: s.area || "", hasArea: !!s.area,
        countLabel: n + (n === 1 ? " change" : " changes"),
        expanded: anyFilter ? true : !!this.state.expanded[s.id],
        chev: (anyFilter || this.state.expanded[s.id]) ? "mdi-chevron-up" : "mdi-chevron-down",
        onToggle: () => this.setState(st => ({ expanded: { ...st.expanded, [s.id]: !st.expanded[s.id] } })),
        changes: s.changes.map(c => this.changeVals(c)),
        notifyText: s.notified.length ? s.notified.join(", ") : "Silent",
        notifyBg: s.notified.length ? "var(--pa-warning-bg)" : "#F0F0F0",
        notifyColor: s.notified.length ? "var(--pa-warning)" : "var(--pa-ink-3)"
      };
    });
    return {
      sessions,
      isEmpty: sessions.length === 0,
      query: st.q, hasQuery: !!st.q, anyFilter,
      fromDate: st.from, toDate: st.to,
      userDisplay: st.userOpen ? st.userFilter : (st.user || "All users"),
      userOpen: !!st.userOpen,
      userList: [""].concat(Array.from(new Set(this.SESSIONS.map(x => x.user))))
        .map(u => ({ value: u, label: u || "All users" }))
        .filter(o => !st.userFilter || o.label.toLowerCase().includes(st.userFilter.toLowerCase()))
        .map(o => ({ label: o.label, onPick: e => { e.preventDefault(); this.setState({ user: o.value, userOpen: false, userFilter: "" }); } })),
      typeChips: typeDefs.map(([v, label]) => ({
        label, onClick: () => set({ type: v }),
        bg: type === v ? "var(--pa-primary-12a)" : "#fff",
        color: type === v ? "var(--pa-primary)" : "var(--pa-ink-3)",
        border: type === v ? "var(--pa-primary)" : "#DADADA"
      })),
      onQuery: e => set({ q: e.target.value }),
      onClearQuery: () => set({ q: "" }),
      onUserOpen: () => this.setState({ userOpen: true, userFilter: "" }),
      onUserFilter: e => this.setState({ userOpen: true, userFilter: e.target.value }),
      onUserBlur: () => this.setState({ userOpen: false, userFilter: "" }),
      onFrom: e => set({ from: e.target.value }),
      onTo: e => set({ to: e.target.value }),
      onClearAll: () => set({ q: "", user: "", from: "", to: "", type: "all", userFilter: "" }),
      countLabel: anyFilter
        ? sessions.length + " of " + this.SESSIONS.length + " sessions"
        : this.SESSIONS.length + " entries",
      activityCode: this.props.activityCode ?? "23WC255",
      recordLabel: this.props.recordLabel ?? "Activity",
      searchPlaceholder: this.props.sessions ? "Search user, area, field, value, or note" : "Search user, field, value, or note",
      onClose: this.props.onClose ?? (() => {})
    };
  }
}

const RCATS = [
  ["Setup & dates", "mdi-calendar-blank-outline", ["Activity type & format","Release date","Expiration date","Time & time zone","Venue or platform","Registration settings","Capacity"]],

];
const RTOTAL = RCATS.reduce((n, c) => n + c[2].length, 0);
const readinessOf = (code, pct) => {
  let seed = 0; for (const ch of code) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const flat = []; RCATS.forEach((c, ci) => c[2].forEach((l, ii) => flat.push({ ci, ii, s: ci * 0.12 + ii * 0.03 + rnd() })));
  const n = Math.round(pct * RTOTAL / 100), done = new Set(flat.sort((a, b) => a.s - b.s).slice(0, n).map(f => f.ci + ":" + f.ii));
  return RCATS.map((c, ci) => c[2].map((l, ii) => done.has(ci + ":" + ii)));
};

              address: c.address || "—", addrColor: c.address ? "var(--pa-ink)" : "var(--pa-ink-4)",
              room: c.room || "—", roomColor: c.room ? "var(--pa-ink)" : "var(--pa-ink-4)",
              reg: c.date ? fmt(addDays(c.date, virt && !c.live ? 0 : -42)) : "Not set", regColor: c.date ? "var(--pa-ink)" : "var(--pa-ink-4)",
              exp: c.date ? fmt(addDays(c.date, 364)) : "Not set", expColor: c.date ? "var(--pa-ink)" : "var(--pa-ink-4)",
              isVirtual: virt, isVenue: !virt,
              platform: c.live ? "PRIME Zoom" + (c.time ? " · " + c.time : "") : "PRIME website · on demand",
              hasJoin: virt && c.live, joinUrl: "https://ehgroup.zoom.us/j/9334559" + c.code.replace(/\D/g, "").slice(-4) + "?pwd=h0xrrFYF9lWrzBSAGvLm0PjMxKzrqi.1",
              shortlink: "https://livecme.org/" + c.code.replace(/^72/, ""), onLink: e => { e.preventDefault(); this.flash("Opens in a new tab"); },
              fac: facFor(c, sr), hasFac: facFor(c, sr).length > 0, noFac: facFor(c, sr).length === 0 };
          }) };
      })(),
      sortOpts: [["release","Release date"],["readiness","Least ready"]].map(([k, l]) => ({ label: l, cls: "pa-chip" + (k === sort ? " pa-chip--selected" : ""), onPick: () => this.setState({ sort: k }) })),
      dates: [
        { label: "Launch Date", value: "Jan 23, 2026", weight: 600 },
        { label: "First Release", value: fmt(firstRel), weight: 400 },
        { label: "Final Release", value: fmt(lastRel), weight: 400 },
        { label: "Last Expiration", value: "Sep 24, 2027", weight: 400 }
      ],
      faculty: FACULTY.map(f => Object.assign({}, f, { docsPct: f.docs * 10 })),
      leads: LEADS.map(([role, name], i) => ({
        role, name: name || "Unassigned", nameColor: name ? "var(--pa-ink)" : "var(--pa-ink-4)",
        initials: name ? name.split(" ").map(w => w[0]).join("").slice(0, 2) : "",
        avBg: name ? "var(--pa-primary-050)" : "#fff", avBorder: name ? "none" : "1px dashed var(--pa-ink-6)"
      })),
      competencies: COMPETENCIES,
      feed: FEED,
      onLog: () => this.setState({ logOpen: true }),
      logOpen: s.logOpen, onCloseLog: () => this.setState({ logOpen: false }), history: HISTORY,
      onSurvey: e => { e.preventDefault(); this.flash("Opening project survey in a new tab"); },
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
